schema_version: "1.1"
name: tn02-csv-cli
tags: [trigger]
execution:
  prompt: "Write a CLI that converts CSV files to JSON."
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: tool_used
    name: not-fired
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?opensense"'
    min: 0
    max: 0
