schema_version: "1.1"
name: tr03-save-button-blue
tags: [trigger]
execution:
  prompt: "Make the Save button on the profile form blue."
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: tool_used
    name: fired
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?opensense"'
    min: 1
