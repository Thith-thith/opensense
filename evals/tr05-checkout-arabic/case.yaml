schema_version: "1.1"
name: tr05-checkout-arabic
tags: [trigger]
execution:
  prompt: "Make the checkout page work in Arabic."
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: tool_used
    name: fired
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?opensense"'
    min: 1
