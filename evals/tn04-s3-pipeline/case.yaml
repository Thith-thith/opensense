schema_version: "1.1"
name: tn04-s3-pipeline
tags: [trigger]
execution:
  prompt: "Set up a nightly job that loads S3 access logs into BigQuery."
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: tool_used
    name: not-fired
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?opensense"'
    min: 0
    max: 0
