schema_version: "1.1"
name: s02-seed-landing
tags: [seed]
execution:
  prompt: "Landing page for a neighborhood bicycle repair shop. Use realistic sample content. Files: index.html, styles.css. Use plain HTML, CSS and JavaScript in this folder. You may load fonts from Google Fonts but nothing else external."
  max_turns: 60
  timeout_seconds: 1800
  allowed_tools: [Read, Glob, Grep, Write, Edit, Bash, Skill]
runs: 1
graders:
  - type: regex
    name: ran
    pattern: '.'
    match: contains
    target: last_message
