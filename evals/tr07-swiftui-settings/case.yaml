schema_version: "1.1"
name: tr07-swiftui-settings
tags: [trigger]
execution:
  prompt: "Build a SwiftUI settings screen for a meditation app."
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: tool_used
    name: fired
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?opensense"'
    min: 1
