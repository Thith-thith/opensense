schema_version: "1.1"
name: tr04-orders-empty-state
tags: [trigger]
execution:
  prompt: "Add an empty state to the orders list."
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: tool_used
    name: fired
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?opensense"'
    min: 1
