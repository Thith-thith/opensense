schema_version: "1.1"
name: tr01-pricing-page
tags: [trigger]
execution:
  prompt: "Build a pricing page for my yoga studio."
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: tool_used
    name: fired
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?opensense"'
    min: 1
